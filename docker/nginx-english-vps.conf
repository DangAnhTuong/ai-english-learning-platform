# ==============================================================================
# Nginx VirtualHost Configuration for english.danganhtuong.dev
# Designed for Ubuntu Linux VPS running alongside Tuong Tan TOEIC
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name english.danganhtuong.dev;

    # Tự động chuyển hướng toàn bộ sang HTTPS qua Let's Encrypt Certbot
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name english.danganhtuong.dev;

    # SSL Certificates (Tạo tự động bằng: sudo certbot --nginx -d english.danganhtuong.dev)
    ssl_certificate /etc/letsencrypt/live/english.danganhtuong.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.danganhtuong.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Phục vụ thư mục build tĩnh React 19 Frontend
    root /var/www/english-app/frontend/build;
    index index.html index.htm;

    # Cho phép upload audio file đánh giá phát âm lên tới 25MB
    client_max_body_size 25M;

    # Gzip Compression tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 1. Routing cho SPA React Frontend
    location / {
        try_files $uri $uri/ /index.html;
        # Cache busting cho index.html để người dùng luôn nhận code mới
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache tài nguyên tĩnh (js, css, ảnh, fonts) 30 ngày
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # 2. Proxy sang Node.js Backend Gateway (Port 3001)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 3. Proxy sang Python FastAPI AI Engine (Port 8000)
    location /py-api/ {
        rewrite ^/py-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 4. Proxy WebSocket thời gian thực (Deepgram STT & Gemini Voice Chat)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s; # Giữ kết nối thoại liên tục 1 giờ không bị timeout
        proxy_send_timeout 3600s;
    }
}
