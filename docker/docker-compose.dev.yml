name: web-learn-english-dev

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: wle-frontend-dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_API_URL: http://localhost:3001/api/v1
      REACT_APP_PYTHON_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend-node:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    networks:
      - app-network

  backend-node:
    build:
      context: ../backend/backend-node
      dockerfile: Dockerfile
      target: development
    container_name: wle-backend-node-dev
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/englishdb_nodejs
      PYTHON_API_URL: http://backend-python:8000
      REDIS_URI: redis://redis:6379
      REQUIRE_COURSE_CONTENT_FOR_PUBLISH: "false"
      CORS_ALLOWLIST: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ../backend/backend-node:/app
      - backend_node_modules:/app/node_modules
      - ../backend/backend-node/.env:/app/.env:ro
    depends_on:
      mongo:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - app-network

  backend-python:
    build:
      context: ../backend/backend-python
      dockerfile: Dockerfile
      target: development
    container_name: wle-backend-python-dev
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "true"
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: english_learning
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - ../backend/backend-python:/app
      - ../backend/backend-python/.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: wle-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: englishdb_nodejs
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: wle-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

volumes:
  frontend_node_modules:
  backend_node_modules:
  mongo_data:
  redis_data:

networks:
  app-network:
    driver: bridge
