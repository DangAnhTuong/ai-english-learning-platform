version: '3.8'

services:
  # Python Backend API
  python-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-learning-api
    ports:
      - "1423:1423" # API port
      - "1424:1424" # WebSocket port
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - HOST=0.0.0.0
      - PORT=1423
      - WS_PORT=1424
      - DEBUG=false
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:1423/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - english-learning-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: english-learning-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - english-learning-network

  # PostgreSQL for database (optional)
  postgres:
    image: postgres:15-alpine
    container_name: english-learning-db
    environment:
      - POSTGRES_DB=english_learning
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - english-learning-network

volumes:
  redis_data:
  postgres_data:


networks:
  english-learning-network:
    driver: bridge
