name: CI & DigitalOcean Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Build & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Backend Node syntax
        run: |
          node -c backend/backend-node/src/server.js
          echo "Node.js syntax verified successfully"

      - name: Verify Backend Python syntax
        run: |
          python -m py_compile backend/backend-python/run_server.py
          echo "Python server syntax verified successfully"

      - name: Verify System Scripts
        run: |
          python -m py_compile scripts/test_full_system.py
          echo "System test script verified successfully"

  deploy:
    name: Deploy to DigitalOcean VPS
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "."
          target: "/root/english_web"

      - name: Execute Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/english_web/docker
            if command -v docker-compose &> /dev/null; then
                docker-compose -f docker-compose.prod.yml up -d --build
            else
                docker compose -f docker-compose.prod.yml up -d --build
            fi
